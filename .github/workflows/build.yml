name: Build

on:
  push:
    branches: [devel]
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout carbonio-mails-ui
        uses: actions/checkout@v4
        with:
          path: carbonio-mails-ui

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: carbonio-mails-ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: carbonio-mails-ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: carbonio-mails-ui
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: carbonio-mails-ui
        run: pnpm run type-check

      - name: Build
        working-directory: carbonio-mails-ui
        run: pnpm run build

      - name: Build .deb
        id: deb
        run: |
          set -euo pipefail

          PKG_NAME="carbonio-mails-ui"
          PKG_VERSION=$(node -p "require('./carbonio-mails-ui/package.json').version")
          PKG_REL="1+HEM${{ github.run_number }}"

          # The commit must come from the build output, not from github.sha: webpack
          # bakes it into component.json's js_entrypoint (/static/iris/<pkg>/<commit>/),
          # so the install directory has to match it exactly or the shell loads nothing.
          COMMIT=$(node -p "require('./carbonio-mails-ui/dist/component.json').commit")
          if [ -z "${COMMIT}" ] || [ "${COMMIT}" = "undefined" ]; then
            echo "ERROR: no commit in dist/component.json" >&2
            exit 1
          fi
          echo "Packaging ${PKG_NAME} ${PKG_VERSION} at commit ${COMMIT}"

          INSTALL_DIR="/opt/zextras/web/iris/${PKG_NAME}/${COMMIT}"

          DEB_ROOT="$(pwd)/deb-root"
          mkdir -p "${DEB_ROOT}/DEBIAN"
          mkdir -p "${DEB_ROOT}${INSTALL_DIR}"

          cp -a carbonio-mails-ui/dist/* "${DEB_ROOT}${INSTALL_DIR}/"

          cat > "${DEB_ROOT}/DEBIAN/control" <<EOF
          Package: ${PKG_NAME}
          Version: ${PKG_VERSION}-${PKG_REL}
          Architecture: all
          Maintainer: Encedo <packages@encedo.com>
          Section: admin
          Priority: optional
          Depends: carbonio-nginx, carbonio-webui-i18n, jq
          Description: Carbonio Mails UI with OpenPGP support (Encedo HEM fork)
          EOF

          # Header carries the build-time identity; the body below is literal.
          cat > "${DEB_ROOT}/DEBIAN/postinst" <<EOF
          #!/bin/bash
          set -euo pipefail
          PKG_NAME="${PKG_NAME}"
          COMMIT="${COMMIT}"
          EOF

          cat >> "${DEB_ROOT}/DEBIAN/postinst" <<'EOF'
          IRIS="/opt/zextras/web/iris"
          PKG_DIR="${IRIS}/${PKG_NAME}"
          COMMIT_DIR="${PKG_DIR}/${COMMIT}"

          if [ ! -f "${COMMIT_DIR}/component.json" ]; then
            echo "ERROR: ${COMMIT_DIR}/component.json missing" >&2
            exit 1
          fi

          # Serve the entry HTML from current/
          mkdir -p "${PKG_DIR}/current"
          cd "${COMMIT_DIR}"
          find . -name "*.html" -exec cp --parents "{}" "${PKG_DIR}/current/" \;

          # Register this build in components.json, replacing only our own entry.
          # A full filesystem rescan would rewrite entries owned by other components.
          COMPONENTS="${IRIS}/components.json"
          TMP=$(mktemp)
          if [ -f "${COMPONENTS}" ]; then
            jq --slurpfile new "${COMMIT_DIR}/component.json" \
              '.components = ((.components // []) | map(select(.name != $new[0].name)) + [$new[0]])' \
              "${COMPONENTS}" > "${TMP}"
          else
            jq -s '{"components":.}' "${COMMIT_DIR}/component.json" > "${TMP}"
          fi
          mv "${TMP}" "${COMPONENTS}"

          # Drop superseded builds of this package so they cannot be activated by mistake
          find "${PKG_DIR}" -mindepth 1 -maxdepth 1 -type d \
            ! -name current ! -name "${COMMIT}" -exec rm -rf {} +

          chown -R zextras:zextras "${PKG_DIR}" 2>/dev/null || true
          chown zextras:zextras "${COMPONENTS}" 2>/dev/null || true
          EOF
          chmod 755 "${DEB_ROOT}/DEBIAN/postinst"

          # --root-owner-group: without it the payload is owned by the runner's
          # uid/gid (1000) instead of root.
          DEB_FILE="${PKG_NAME}_${PKG_VERSION}-${PKG_REL}_all.deb"
          dpkg-deb --root-owner-group --build "${DEB_ROOT}" "${DEB_FILE}"

          echo "deb_file=${DEB_FILE}" >> $GITHUB_OUTPUT
          echo "version=${PKG_VERSION}-${PKG_REL}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.deb.outputs.version }}
          name: v${{ steps.deb.outputs.version }}
          files: ${{ steps.deb.outputs.deb_file }}
          generate_release_notes: false
          body: |
            Build ${{ github.run_number }} — commit ${{ github.sha }}
